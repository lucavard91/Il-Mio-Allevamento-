function paymentModal(p){return new Promise(res=>{let d=document.createElement('div');d.className='modal';let today=new Date().toISOString().slice(0,10);d.innerHTML=`<div class="modalbox"><h3 style="margin-top:0">Gestione pagamento</h3><div class="formgrid"><div class="field"><label>Stato</label><select id="paystate"><option value="non_pagato" ${p.stato_pagamento==='non_pagato'||!p.stato_pagamento?'selected':''}>Non pagato</option><option value="in_sospeso" ${p.stato_pagamento==='in_sospeso'?'selected':''}>In sospeso</option><option value="pagato">Pagato — registra pagamento reale</option></select></div><div id="pendingFields"><div class="field"><label>Importo atteso (€) — facoltativo</label><input id="payexpected" inputmode="decimal" value="${esc(p.importo_atteso??'')}"></div><div class="field"><label>Promemoria — facoltativo</label><input id="payreminder" value="${esc(p.promemoria_pagamento||'')}"></div></div><div id="paidFields" class="hidden"><div class="field"><label>Importo realmente ricevuto (€)</label><input id="payreal" inputmode="decimal" placeholder="0,00"></div><div class="field"><label>Tipo pagamento</label><select id="paytype"><option value="prima_attivazione">Prima attivazione</option><option value="rinnovo">Rinnovo</option><option value="altro">Altro</option></select></div><div class="field"><label>Data pagamento</label><input id="paydate" type="date" value="${today}"></div><div class="field"><label>Nota — facoltativa</label><input id="paynote" placeholder="Es. Bonifico, contanti…"></div><div class="hint">Solo Pagato crea un movimento reale in Contabilità OrniBreed.</div></div></div><div class="modalactions"><button class="secondary" id="no">Annulla</button><button class="primary" id="yes">Salva</button></div></div>`;document.body.appendChild(d);let state=d.querySelector('#paystate'),pending=d.querySelector('#pendingFields'),paid=d.querySelector('#paidFields');let sync=()=>{let isPaid=state.value==='pagato';pending.classList.toggle('hidden',isPaid);paid.classList.toggle('hidden',!isPaid)};state.onchange=sync;sync();d.querySelector('#no').onclick=()=>{d.remove();res(null)};d.querySelector('#yes').onclick=()=>{if(state.value==='pagato'){let raw=d.querySelector('#payreal').value.trim().replace(',','.');let amount=Number(raw);if(raw===''||!Number.isFinite(amount)||amount<0){d.querySelector('#payreal').focus();return}let out={mode:'paid',importo:amount,tipo:d.querySelector('#paytype').value,data:d.querySelector('#paydate').value||today,note:d.querySelector('#paynote').value.trim()||null};d.remove();res(out);return}let raw=d.querySelector('#payexpected').value.trim().replace(',','.');let amount=raw===''?null:Number(raw);if(raw!==''&&(!Number.isFinite(amount)||amount<0)){d.querySelector('#payexpected').focus();return}let out={mode:'status',payload:{stato_pagamento:state.value,importo_atteso:amount,promemoria_pagamento:d.querySelector('#payreminder').value.trim()||null}};d.remove();res(out)}})}

function detail(id){let p=users.find(x=>x.user_id===id);if(!p)return;$('admin').classList.add('hidden');$('detail').classList.remove('hidden');let trial=p.prova_gratuita?`Prova gratuita fino al ${dateIT(p.prova_gratuita_fine||p.scadenza)}`:(stato(p)==='pending'?'Non ancora attivata':'Nessuna prova attiva');$('detail').innerHTML=`<button class="secondary" id="back">← Gestione utenti</button><div class="card" style="margin-top:12px"><h3>${isAdmin(p.ruolo)?'👑 ':'👤 '}${esc(nome(p))}</h3><div class="small">${esc(p.email||'-')}${p.username?' · @'+esc(p.username):''}</div><div class="badge ${stato(p)==='active'?'ok':stato(p)==='pending'?'warn':'bad'}">${label(p)}</div></div><div class="settings">${isOwner(p.ruolo)?row('Stato account','Account protetto','protected'):row('Stato account',label(p),'state')}${stato(p)==='pending'?row('Attivazione iniziale','🎁 Prova gratuita — 1 mese','trial'):row('Prova gratuita',trial,'trial')}${row('Piano abbonamento',p.illimitato?'Illimitato':(p.piano||'Standard'),'plan')}${row('Durata / Scadenza',p.illimitato?'Accesso illimitato':p.scadenza?dateIT(p.scadenza):'Non impostata','expiry')}${row('Stato pagamento',paymentLabel(p),'payment')}${p.importo_atteso!=null?row('Importo atteso',`${Number(p.importo_atteso).toFixed(2)} €`,'payment'):''}${p.promemoria_pagamento?row('Promemoria pagamento',p.promemoria_pagamento,'payment'):''}${row('Ruolo',isOwner(p.ruolo)?'Proprietario fondatore':roleLabel(p.ruolo),'role')}${isOwner(p.ruolo)?'':row('Elimina definitivamente','Doppia conferma richiesta','delete',true)}</div>`;$('back').onclick=()=>{$('detail').classList.add('hidden');$('admin').classList.remove('hidden')};$('detail').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>edit(id,b.dataset.a))}
async function edit(id,a){let p=users.find(x=>x.user_id===id);if(a==='protected'){await modal('👑 Proprietario fondatore\n\nQuesto account non può essere sospeso, retrocesso o eliminato.');return}
if(a==='state'){let v=await choiceModal('Stato account',[{value:'active',label:'Attivo'},{value:'suspended',label:'Sospeso'}],stato(p)==='active'?'active':'suspended');if(v===null)return;let payload=v==='active'?{attivo:true,sospeso_at:null}:{attivo:false,sospeso_at:new Date().toISOString()};if(v==='active'&&!p.approvato_at)payload.approvato_at=new Date().toISOString();let {error}=await sb.from('profili_utenti').update(payload).eq('user_id',id);if(error)return modal(error.message);await reload();detail(id);return}
if(a==='trial'){if(isOwner(p.ruolo))return modal('Il Proprietario non necessita della prova gratuita.');let ok=await modal('Attivare la prova gratuita di 1 mese?\n\nLa scadenza verrà calcolata automaticamente da oggi.',true);if(!ok)return;let today=new Date().toISOString().slice(0,10),end=addOneMonthISO();let {error}=await sb.from('profili_utenti').update({attivo:true,approvato_at:p.approvato_at||new Date().toISOString(),sospeso_at:null,illimitato:false,piano:'standard',scadenza:end,prova_gratuita:true,prova_gratuita_inizio:today,prova_gratuita_fine:end,stato_pagamento:'non_pagato'}).eq('user_id',id);if(error)return modal(error.message);await reload();detail(id);return}
if(a==='plan'){let current=p.illimitato?'illimitato':(p.piano||'standard');let v=await choiceModal('Piano abbonamento',[{value:'standard',label:'Standard'},{value:'premium',label:'Premium'},{value:'illimitato',label:'Illimitato'}],current);if(v===null)return;let payload=v==='illimitato'?{piano:'premium',illimitato:true,scadenza:null,prova_gratuita:false}:{piano:v,illimitato:false,prova_gratuita:false};let {error}=await sb.from('profili_utenti').update(payload).eq('user_id',id);if(error)return modal(error.message);await reload();detail(id);return}
if(a==='expiry'){if(p.illimitato)return modal('Disattiva prima l’accesso illimitato.');let v=await dateModal(p.scadenza);if(v===null)return;let {error}=await sb.from('profili_utenti').update({scadenza:v,prova_gratuita:false}).eq('user_id',id);if(error)return modal(error.message);await reload();detail(id);return}
if(a==='payment'){let v=await paymentModal(p);if(v===null)return;if(v.mode==='paid'){let ok=await modal(`Confermi la registrazione del pagamento reale di ${Number(v.importo).toFixed(2)} €?\n\nQuesta operazione creerà anche il movimento nella Contabilità OrniBreed e l’eventuale commissione Partner.`,true);if(!ok)return;let {data,error}=await sb.rpc('ornibreed_admin_registra_pagamento',{p_user_id:id,p_importo:v.importo,p_tipo:v.tipo,p_data_pagamento:v.data,p_note:v.note});if(error)return modal(error.message);await reload();detail(id);await modal('✅ Pagamento registrato correttamente.\n\nContabilità ed eventuale commissione Partner sono state aggiornate dal database.');return}let {error}=await sb.from('profili_utenti').update(v.payload).eq('user_id',id);if(error)return modal(error.message);await reload();detail(id);return}
if(a==='role'){if(isOwner(p.ruolo))return modal('Il Proprietario fondatore è protetto.');let v=await choiceModal('Ruolo',[{value:'utente',label:'Utente'},{value:'admin',label:'Admin'},{value:'admin_principale',label:'Admin principale'}],p.ruolo||'utente');if(v===null)return;let {error}=await sb.from('profili_utenti').update({ruolo:v}).eq('user_id',id);if(error)return modal(error.message);await reload();detail(id);return}
if(a==='delete'){
if(isOwner(p.ruolo))return modal('👑 Il Proprietario fondatore è protetto e non può essere eliminato.');
let ok=await modal(`⚠️ ELIMINAZIONE DEFINITIVA\n\nStai per eliminare definitivamente ${nome(p)}.\n\nVerranno rimossi account Auth, profilo, allevamenti, soggetti, fotografie e dati operativi. Lo storico economico OrniBreed resterà conservato e anonimizzato.\n\nQuesta operazione non può essere annullata.`,true);
if(!ok)return;
let parola=await modal('Seconda conferma di sicurezza.\n\nScrivi esattamente ELIMINA per procedere.',false,true);
if(parola===null)return;
if(String(parola).trim().toUpperCase()!=='ELIMINA')return modal('Operazione annullata: la parola di conferma non corrisponde.');
let {data,error}=await sb.functions.invoke('delete-user-account',{body:{user_id:id}});
if(error)return modal(`❌ Cancellazione non completata.\n\n${error.message||'Errore Edge Function'}`);
if(!data?.ok)return modal(`❌ Cancellazione non completata.\n\n${data?.error||'Risposta server non valida'}`);
$('detail').classList.add('hidden');$('admin').classList.remove('hidden');
await reload();
await modal('✅ Account eliminato definitivamente.\n\nLo storico economico OrniBreed è stato conservato senza collegamento al profilo eliminato.');
return}}
function partnerNome(p){return String(p?.nome||'Partner').trim()}
function partnerTelefonoLink(v){let n=String(v||'').trim().replace(/[^\d+]/g,'');if(!n)return null;if(n.startsWith('00'))n='+'+n.slice(2);return n.replace('+','')}
async function loadPartners(){let {data,error}=await sb.from('ornibreed_partner').select('*').order('created_at',{ascending:false});if(error){partners=[];return modal('Errore caricamento Partner: '+error.message)}partners=data||[]}
function openPartnerListPage(){partnerQuery='';showPartnerPage(`<div class="card"><div class="head"><div><h2 style="margin:0">🤝 Lista Partner</h2><div class="small">Cerca per nome, referente o codice Partner.</div></div><button class="secondary" id="partnerBack">← Amministrazione</button></div><div class="search" style="margin-top:12px"><input id="partnerSearch" placeholder="Nome, referente o codice OB-XXXXXX"><button class="primary" id="partnerSearchBtn">Cerca</button></div></div><div id="partnerList"></div>`);$('partnerBack').onclick=closePartnerPage;$('partnerSearchBtn').onclick=()=>{partnerQuery=$('partnerSearch').value.trim().toLowerCase();renderPartnerListInternal()};$('partnerSearch').addEventListener('keydown',e=>{if(e.key==='Enter')$('partnerSearchBtn').click()});renderPartnerListInternal()}
function renderPartnerListInternal(){let box=$('partnerList');if(!box)return;let a=partners.filter(p=>!partnerQuery||[p.nome,p.referente,p.codice,p.email,p.telefono].some(v=>String(v||'').toLowerCase().includes(partnerQuery)));if(!a.length){box.innerHTML='<div class="card">Nessun Partner trovato.</div>';return}box.innerHTML=a.map(p=>`<button class="partner-row" data-partner="${esc(p.id)}"><span><b>${esc(partnerNome(p))}</b><small>${esc(p.referente||'Referente non indicato')} · <span class="partner-code">${esc(p.codice)}</span> · ${Number(p.commissione_percentuale||0).toFixed(2)}%${p.commissione_rinnovi?' · rinnovi inclusi':''}</small></span><span><span class="partner-badge ${p.attivo?'':'off'}">${p.attivo?'Attivo':'Disattivato'}</span><span class="chev">›</span></span></button>`).join('');box.querySelectorAll('[data-partner]').forEach(b=>b.onclick=()=>openPartner(b.dataset.partner,true))}
function partnerFormHtml(p={}){const edit=!!p.id;return `<div class="card partner-form"><div class="head"><div><h2 style="margin:0">${edit?'Modifica Partner':'Nuovo Partner'}</h2><div class="small">${edit?`Codice stabile: <span class="partner-code">${esc(p.codice)}</span>`:'Il codice OrniBreed verrà generato automaticamente e sarà unico.'}</div></div><button class="secondary" id="partnerBack">← Indietro</button></div><div class="partner-grid" style="margin-top:14px"><div><label>Nome Partner / Associazione *</label><input id="ptNome" value="${esc(p.nome||'')}"></div><div><label>Referente</label><input id="ptReferente" value="${esc(p.referente||'')}"></div><div><label>Tipo</label><select id="ptTipo"><option value="associazione">Associazione</option><option value="allevatore">Allevatore</option><option value="negozio">Negozio</option><option value="altro">Altro</option></select></div><div><label>Commissione %</label><input id="ptCommissione" inputmode="decimal" value="${esc(p.commissione_percentuale??0)}"></div><div><label>Email</label><input id="ptEmail" type="email" value="${esc(p.email||'')}"></div><div><label>Telefono / WhatsApp</label><input id="ptTelefono" value="${esc(p.telefono||'')}"></div><div><label>Commissione sui rinnovi</label><select id="ptRinnovi"><option value="true">Sì</option><option value="false">No</option></select></div><div><label>Stato Partner</label><select id="ptAttivo"><option value="true">Attivo</option><option value="false">Disattivato</option></select></div></div><div style="margin-top:10px"><label>Note</label><textarea id="ptNote">${esc(p.note||'')}</textarea></div><div class="partner-actions" style="margin-top:12px"><button class="success" id="partnerSave">💾 Salva Partner</button>${edit?'<button class="secondary" id="partnerCopy">📋 Copia codice</button><button class="secondary" id="partnerCopyLink">🔗 Copia link invito</button>':''}${edit&&p.telefono?'<button class="secondary" id="partnerWhatsapp">WhatsApp</button>':''}${edit?'<button class="danger" id="partnerDelete">Elimina definitivamente</button>':''}</div><div class="small" style="margin-top:10px">${edit?'Le modifiche alla commissione valgono per i pagamenti futuri; lo storico già contabilizzato non viene riscritto.':'Dopo il salvataggio il codice resta associato a questo Partner.'}</div></div>`}
function showPartnerPage(html){$('admin').classList.add('hidden');$('detail').classList.add('hidden');$('partnerDetail').innerHTML=html;$('partnerDetail').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function closePartnerPage(){$('partnerDetail').classList.add('hidden');$('partnerDetail').innerHTML='';$('admin').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function bindPartnerForm(p={}){$('ptTipo').value=p.tipo||'associazione';$('ptRinnovi').value=String(p.commissione_rinnovi??true);$('ptAttivo').value=String(p.attivo??true);$('partnerBack').onclick=closePartnerPage;$('partnerSave').onclick=()=>savePartner(p.id||null);let wa=$('partnerWhatsapp');if(wa)wa.onclick=()=>openPartnerWhatsapp(p);let cp=$('partnerCopy');if(cp)cp.onclick=()=>copyText(p.codice,'Codice Partner copiato.');let cl=$('partnerCopyLink');if(cl)cl.onclick=()=>copyText(partnerReferralLink(p),'Link invito Partner copiato.');let del=$('partnerDelete');if(del)del.onclick=()=>deletePartner(p)}
function openPartner(id){let p=partners.find(x=>x.id===id);if(!p)return;showPartnerPage(partnerFormHtml(p));bindPartnerForm(p)}
function newPartner(){showPartnerPage(partnerFormHtml({commissione_percentuale:0,commissione_rinnovi:true,attivo:true,tipo:'associazione'}));bindPartnerForm({})}
async function generaCodicePartner(){let {data,error}=await sb.rpc('ornibreed_genera_codice_partner');if(error)throw error;if(!data)throw new Error('Codice Partner non generato');return String(data).toUpperCase()}
function readPartnerPayload(){let nomeV=$('ptNome').value.trim(),commissione=Number(String($('ptCommissione').value).replace(',','.'));if(!nomeV)throw new Error('Inserisci il nome del Partner / Associazione.');if(!Number.isFinite(commissione)||commissione<0||commissione>100)throw new Error('La commissione deve essere compresa tra 0 e 100.');return {nome:nomeV,referente:$('ptReferente').value.trim()||null,tipo:$('ptTipo').value,commissione_percentuale:commissione,commissione_rinnovi:$('ptRinnovi').value==='true',telefono:$('ptTelefono').value.trim()||null,email:$('ptEmail').value.trim()||null,note:$('ptNote').value.trim()||null,attivo:$('ptAttivo').value==='true'}}
async function savePartner(id){let payload;try{payload=readPartnerPayload()}catch(e){return modal(e.message)}if(id){let {error}=await sb.from('ornibreed_partner').update(payload).eq('id',id);if(error)return modal(error.message);await loadPartners();closePartnerPage();await modal('✅ Partner aggiornato correttamente.');return}let created=null,lastError=null;for(let i=0;i<8;i++){try{payload.codice=await generaCodicePartner()}catch(e){return modal(e.message)}let {data,error}=await sb.from('ornibreed_partner').insert(payload).select('*').single();if(!error){created=data;break}lastError=error;if(String(error.code)!=='23505')break}if(!created)return modal(`Partner non creato.\n\n${lastError?.message||'Impossibile generare un codice univoco.'}`);await loadPartners();closePartnerPage();await modal(`✅ Partner creato correttamente.\n\nCodice Partner: ${created.codice}\n\nIl codice è univoco e resta associato a questo Partner.`)}
function partnerReferralLink(p){return `${location.origin}${location.pathname.replace(/admin[^/]*$/i,'index.html')}?ref=${encodeURIComponent(p.codice)}`}
async function copyText(v,msg){try{await navigator.clipboard.writeText(String(v));await modal('✅ '+msg)}catch(e){let val=await modal('Copia manualmente questo valore:\n\n'+String(v),false,true);}}
async function deletePartner(p){let ok=await modal(`⚠️ ELIMINAZIONE DEFINITIVA PARTNER\n\nStai per eliminare ${partnerNome(p)} (${p.codice}).\n\nIl Partner sparirà definitivamente dalla lista. Se il database rileva collegamenti storici che non possono essere rimossi, l'operazione verrà bloccata per proteggere contabilità e commissioni.`,true);if(!ok)return;let parola=await modal('Seconda conferma di sicurezza.\n\nScrivi esattamente ELIMINA per procedere.',false,true);if(parola===null)return;if(String(parola).trim().toUpperCase()!=='ELIMINA')return modal('Operazione annullata: la parola di conferma non corrisponde.');let {error}=await sb.from('ornibreed_partner').delete().eq('id',p.id);if(error)return modal(`❌ Partner non eliminato.\n\n${error.message}\n\nSe esiste già uno storico collegato, va prima predisposta la conservazione contabile lato database.`);await loadPartners();closePartnerPage();await modal('✅ Partner eliminato definitivamente.');}
function openPartnerWhatsapp(p){let tel=partnerTelefonoLink(p.telefono);if(!tel)return modal('Numero WhatsApp non disponibile.');let msg=`Ciao ${p.referente||''}, sei stato registrato come Partner OrniBreed Manager.\n\nIl tuo codice Partner personale è ${p.codice}.\nPuoi comunicarlo alle persone che desiderano registrarsi su OrniBreed.`;window.open(`https://wa.me/${encodeURIComponent(tel)}?text=${encodeURIComponent(msg)}`,'_blank','noopener')}

$('searchBtn').onclick=()=>{query=$('search').value;reviewMode=null;selected.clear();userListOpen=true;renderReview();renderList()};$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){$('searchBtn').click()}});$('refresh').onclick=reload;$('newPartner').onclick=newPartner;$('openPartnerList').onclick=openPartnerListPage;load();
</script></body></html>
