function dateModal(current){return new Promise(res=>{let d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="modalbox"><h3 style="margin-top:0">Scadenza</h3><div class="field"><label>Data (GG/MM/AAAA)</label><input id="datev" inputmode="numeric" placeholder="GG/MM/AAAA" value="${esc(current?dateIT(current):'')}"><div class="hint">Esempio: 21/10/2026</div></div><div class="modalactions"><button class="secondary" id="no">Annulla</button><button class="primary" id="yes">Salva</button></div></div>`;document.body.appendChild(d);d.querySelector('#no').onclick=()=>{d.remove();res(null)};d.querySelector('#yes').onclick=()=>{let v=d.querySelector('#datev').value;let iso=toISODateIT(v);if(!iso){d.querySelector('.hint').textContent='Data non valida. Usa GG/MM/AAAA.';return}d.remove();res(iso)}})}
function paymentModal(p){return new Promise(res=>{let d=document.createElement('div');d.className='modal';let today=new Date().toISOString().slice(0,10);d.innerHTML=`<div class="modalbox"><h3 style="margin-top:0">Gestione pagamento</h3><div class="formgrid"><div class="field"><label>Stato</label><select id="paystate"><option value="non_pagato" ${p.stato_pagamento==='non_pagato'||!p.stato_pagamento?'selected':''}>Non pagato</option><option value="in_sospeso" ${p.stato_pagamento==='in_sospeso'?'selected':''}>In sospeso</option><option value="pagato">Pagato — registra pagamento reale</option></select></div><div id="pendingFields"><div class="field"><label>Importo atteso (€) — facoltativo</label><input id="payexpected" inputmode="decimal" value="${esc(p.importo_atteso??'')}"></div><div class="field"><label>Promemoria — facoltativo</label><input id="payreminder" value="${esc(p.promemoria_pagamento||'')}"></div></div><div id="paidFields" class="hidden"><div class="field"><label>Importo realmente ricevuto (€)</label><input id="payreal" inputmode="decimal" placeholder="0,00"></div><div class="field"><label>Tipo pagamento</label><select id="paytype"><option value="prima_attivazione">Prima attivazione</option><option value="rinnovo">Rinnovo</option><option value="altro">Altro</option></select></div><div class="field"><label>Data pagamento</label><input id="paydate" type="date" value="${today}"></div><div class="field"><label>Nota — facoltativa</label><input id="paynote" placeholder="Es. Bonifico, contanti…"></div><div class="hint">Solo Pagato crea un movimento reale in Contabilità OrniBreed.</div></div></div><div class="modalactions"><button class="secondary" id="no">Annulla</button><button class="primary" id="yes">Salva</button></div></div>`;document.body.appendChild(d);let state=d.querySelector('#paystate'),pending=d.querySelector('#pendingFields'),paid=d.querySelector('#paidFields');let sync=()=>{let isPaid=state.value==='pagato';pending.classList.toggle('hidden',isPaid);paid.classList.toggle('hidden',!isPaid)};state.onchange=sync;sync();d.querySelector('#no').onclick=()=>{d.remove();res(null)};d.querySelector('#yes').onclick=()=>{if(state.value==='pagato'){let raw=d.querySelector('#payreal').value.trim().replace(',','.');let amount=Number(raw);if(raw===''||!Number.isFinite(amount)||amount<0){d.querySelector('#payreal').focus();return}let out={mode:'paid',importo:amount,tipo:d.querySelector('#paytype').value,data:d.querySelector('#paydate').value||today,note:d.querySelector('#paynote').value.trim()||null};d.remove();res(out);return}let raw=d.querySelector('#payexpected').value.trim().replace(',','.');let amount=raw===''?null:Number(raw);if(raw!==''&&(!Number.isFinite(amount)||amount<0)){d.querySelector('#payexpected').focus();return}let out={mode:'status',payload:{stato_pagamento:state.value,importo_atteso:amount,promemoria_pagamento:d.querySelector('#payreminder').value.trim()||null}};d.remove();res(out)}})}
async function load(){let {data:{session}}=await sb.auth.getSession();if(!session){$('status').innerHTML='<b>Sessione non trovata.</b><br><span class="small">Accedi prima da OrniBreed.</span><br><br><button class="primary" onclick="location.href=\'index.html?from=admin\'">Vai al login</button>';return}let {data:p,error:e}=await sb.from('profili_utenti').select('*').eq('user_id',session.user.id).single();if(e||!p||!isAdmin(p.ruolo)){$('status').innerHTML='<b>Accesso amministrativo non autorizzato.</b><br><br><button class="primary" onclick="location.href=\'index.html?from=admin\'">Torna a OrniBreed</button>';return}$('status').classList.add('hidden');$('admin').classList.remove('hidden');await reload()}
async function reload(){let {data,error}=await sb.from('profili_utenti').select('*').order('created_at',{ascending:false});if(error){await modal(error.message);return}users=data||[];renderRequests();if(users.length===1){console.warn('OrniBreed Admin: la query profili_utenti restituisce un solo profilo. Verificare le policy RLS amministrative.')}renderCounts();renderReview();renderList()}
function renderRequests(){let pending=users.filter(p=>stato(p)==='pending');$('requests').innerHTML=pending.length?`<div class="card request"><div class="head"><div><h3 style="margin:0">🔔 Richieste di attivazione</h3><div class="small">${pending.length} account ${pending.length===1?'in attesa':'in attesa'} di approvazione.</div></div><button class="secondary" id="showPending">Apri</button></div></div>`:'';let b=$('showPending');if(b)b.onclick=()=>{filter='pending';query='';reviewMode=null;selected.clear();$('search').value='';renderCounts();renderReview();renderList()}}
function renderCounts(){let c={all:users.length,active:0,suspended:0,pending:0};users.forEach(p=>c[stato(p)]++);$('counts').innerHTML=`<div class="grid4" style="margin-bottom:12px">${[['all','Account totali'],['active','Attivi'],['suspended','Sospesi'],['pending','In attesa']].map(([k,t])=>`<button class="stat ${filter===k?'active':''}" data-f="${k}"><b>${c[k]}</b><span>${t}</span></button>`).join('')}</div>`;$('counts').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;query='';reviewMode=null;selected.clear();$('search').value='';renderCounts();renderReview();renderList()})}
function renderReview(){let exp6=users.filter(p=>isExpired(p)&&mesiScaduti(p.scadenza)>=6).length,exp12=users.filter(p=>isExpired(p)&&mesiScaduti(p.scadenza)>=12).length,susp=users.filter(p=>stato(p)==='suspended').length;$('review').innerHTML=`<div class="card"><div class="head"><div><h3 style="margin:0">🧹 Account scaduti / da revisionare</h3><div class="small">Nessuna eliminazione automatica. Gli account restano identificabili prima di qualsiasi azione definitiva.</div></div></div><div class="reviewbar" style="margin-top:12px"><button class="secondary" data-r="6">Scaduti ≥ 6 mesi (${exp6})</button><button class="secondary" data-r="12">Scaduti ≥ 12 mesi (${exp12})</button><button class="secondary" data-r="suspended">Sospesi (${susp})</button><button class="secondary" data-r="clear">Mostra tutti</button></div>${reviewMode?`<div class="review-actions"><button class="secondary" id="selectShown">Seleziona quelli mostrati</button><button class="danger" id="deleteSelected">Elimina selezionati (${selected.size})</button></div>`:''}</div>`;$('review').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{let r=b.dataset.r;if(r==='clear'){resetView();return}reviewMode=r;filter='all';query='';selected.clear();$('search').value='';renderCounts();renderReview();renderList()});let ss=$('selectShown');if(ss)ss.onclick=()=>{visibleUsers().filter(p=>!isOwner(p.ruolo)).forEach(p=>selected.add(p.user_id));renderReview();renderList()};let ds=$('deleteSelected');if(ds)ds.onclick=()=>modal('⚠️ Eliminazione definitiva non ancora abilitata.\n\nLa selezione multipla è pronta, ma la cancellazione reale verrà collegata solo alla Edge Function server-side delete-user-account per evitare cancellazioni parziali.')}
function visibleUsers(){let q=query.trim().toLowerCase();return users.filter(p=>{let okFilter=filter==='all'||stato(p)===filter;let okQ=!q||[p.nome,p.cognome,p.email,p.username].filter(Boolean).join(' ').toLowerCase().includes(q);let okReview=!reviewMode||(reviewMode==='suspended'?stato(p)==='suspended':isExpired(p)&&mesiScaduti(p.scadenza)>=Number(reviewMode));return okFilter&&okQ&&okReview})}
function renderList(){let a=visibleUsers();$('list').innerHTML=a.length?a.map(p=>{let reviewInfo=isExpired(p)?` · Scaduto da ${mesiScaduti(p.scadenza)} mesi`:stato(p)==='suspended'?' · Sospeso manualmente':'';let sel=reviewMode&&!isOwner(p.ruolo)?`<span class="selectrow"><input type="checkbox" data-select="${esc(p.user_id)}" ${selected.has(p.user_id)?'checked':''}><span>`:'<span>';let end=reviewMode&&!isOwner(p.ruolo)?'</span></span>':'</span>';return `<div class="user" style="cursor:default">${sel}<strong>${isAdmin(p.ruolo)?'👑 ':''}${esc(nome(p))} ${isOwner(p.ruolo)?'<span class="role">PROPRIETARIO</span>':p.ruolo==='admin_principale'?'<span class="role">ADMIN PRINCIPALE</span>':p.ruolo==='admin'?'<span class="role">ADMIN</span>':''}</strong><small>${esc(p.email||'-')}${p.username?' · @'+esc(p.username):''}</small><small>${label(p)} · ${p.illimitato?'Illimitato':esc(p.piano||'standard')} · ${p.illimitato?'Nessuna scadenza':p.scadenza?'Scadenza '+dateIT(p.scadenza):'Scadenza non impostata'}${reviewInfo}</small>${end}<button class="secondary" data-id="${esc(p.user_id)}">Apri</button></div>`}).join(''):'<div class="card">Nessun utente trovato.</div>';$('list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id));$('list').querySelectorAll('[data-select]').forEach(c=>c.onchange=()=>{c.checked?selected.add(c.dataset.select):selected.delete(c.dataset.select);renderReview()})}

function detail(id){let p=users.find(x=>x.user_id===id);if(!p)return;$('admin').classList.add('hidden');$('detail').classList.remove('hidden');let trial=p.prova_gratuita?`Prova gratuita fino al ${dateIT(p.prova_gratuita_fine||p.scadenza)}`:(stato(p)==='pending'?'Non ancora attivata':'Nessuna prova attiva');$('detail').innerHTML=`<button class="secondary" id="back">← Gestione utenti</button><div class="card" style="margin-top:12px"><h3>${isAdmin(p.ruolo)?'👑 ':'👤 '}${esc(nome(p))}</h3><div class="small">${esc(p.email||'-')}${p.username?' · @'+esc(p.username):''}</div><div class="badge ${stato(p)==='active'?'ok':stato(p)==='pending'?'warn':'bad'}">${label(p)}</div></div><div class="settings">${isOwner(p.ruolo)?row('Stato account','Account protetto','protected'):row('Stato account',label(p),'state')}${stato(p)==='pending'?row('Attivazione iniziale','🎁 Prova gratuita — 1 mese','trial'):row('Prova gratuita',trial,'trial')}${row('Piano abbonamento',p.illimitato?'Illimitato':(p.piano||'Standard'),'plan')}${row('Durata / Scadenza',p.illimitato?'Accesso illimitato':p.scadenza?dateIT(p.scadenza):'Non impostata','expiry')}${row('Stato pagamento',paymentLabel(p),'payment')}${p.importo_atteso!=null?row('Importo atteso',`${Number(p.importo_atteso).toFixed(2)} €`,'payment'):''}${p.promemoria_pagamento?row('Promemoria pagamento',p.promemoria_pagamento,'payment'):''}${row('Ruolo',isOwner(p.ruolo)?'Proprietario fondatore':roleLabel(p.ruolo),'role')}${isOwner(p.ruolo)?'':row('Elimina definitivamente','Disponibile dopo collaudo Edge Function','delete',true)}</div>`;$('back').onclick=()=>{$('detail').classList.add('hidden');$('admin').classList.remove('hidden')};$('detail').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>edit(id,b.dataset.a))}
async function edit(id,a){let p=users.find(x=>x.user_id===id);if(a==='protected'){await modal('👑 Proprietario fondatore\n\nQuesto account non può essere sospeso, retrocesso o eliminato.');return}
if(a==='state'){let v=await choiceModal('Stato account',[{value:'active',label:'Attivo'},{value:'suspended',label:'Sospeso'}],stato(p)==='active'?'active':'suspended');if(v===null)return;let payload=v==='active'?{attivo:true,sospeso_at:null}:{attivo:false,sospeso_at:new Date().toISOString()};if(v==='active'&&!p.approvato_at)payload.approvato_at=new Date().toISOString();let {error}=await sb.from('profili_utenti').update(payload).eq('user_id',id);if(error)return modal(error.message);await reload();detail(id);return}

if(a==='plan'){let current=p.illimitato?'illimitato':(p.piano||'standard');let v=await choiceModal('Piano abbonamento',[{value:'standard',label:'Standard'},{value:'premium',label:'Premium'},{value:'illimitato',label:'Illimitato'}],current);if(v===null)return;let payload=v==='illimitato'?{piano:'premium',illimitato:true,scadenza:null,prova_gratuita:false}:{piano:v,illimitato:false,prova_gratuita:false};let {error}=await sb.from('profili_utenti').update(payload).eq('user_id',id);if(error)return modal(error.message);await reload();detail(id);return}
if(a==='expiry'){if(p.illimitato)return modal('Disattiva prima l’accesso illimitato.');let v=await dateModal(p.scadenza);if(v===null)return;let {error}=await sb.from('profili_utenti').update({scadenza:v,prova_gratuita:false}).eq('user_id',id);if(error)return modal(error.message);await reload();detail(id);return}
if(a==='payment'){let v=await paymentModal(p);if(v===null)return;if(v.mode==='paid'){let ok=await modal(`Confermi la registrazione del pagamento reale di ${Number(v.importo).toFixed(2)} €?\n\nQuesta operazione creerà anche il movimento nella Contabilità OrniBreed e l’eventuale commissione Partner.`,true);if(!ok)return;let {data,error}=await sb.rpc('ornibreed_admin_registra_pagamento',{p_user_id:id,p_importo:v.importo,p_tipo:v.tipo,p_data_pagamento:v.data,p_note:v.note});if(error)return modal(error.message);await reload();detail(id);await modal('✅ Pagamento registrato correttamente.\n\nContabilità ed eventuale commissione Partner sono state aggiornate dal database.');return}let {error}=await sb.from('profili_utenti').update(v.payload).eq('user_id',id);if(error)return modal(error.message);await reload();detail(id);return}
if(a==='role'){if(isOwner(p.ruolo))return modal('Il Proprietario fondatore è protetto.');let v=await choiceModal('Ruolo',[{value:'utente',label:'Utente'},{value:'admin',label:'Admin'},{value:'admin_principale',label:'Admin principale'}],p.ruolo||'utente');if(v===null)return;let {error}=await sb.from('profili_utenti').update({ruolo:v}).eq('user_id',id);if(error)return modal(error.message);await reload();detail(id);return}
if(a==='delete'){await modal('⚠️ Eliminazione definitiva non ancora abilitata in questo blocco.\n\nLa attiveremo solo dopo aver collaudato la Edge Function delete-user-account, così non rischiamo cancellazioni parziali.');return}}
$('searchBtn').onclick=()=>{query=$('search').value;reviewMode=null;selected.clear();renderReview();renderList()};$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){$('searchBtn').click()}});$('refresh').onclick=reload;load();
</script></body></html>
